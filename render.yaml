# Render Blueprint: one Docker web service on the free plan.
# Render > New > Blueprint (or New > Web Service > Docker) > connect this repo.
# Values marked "sync: false" are asked for in the dashboard and are never stored in git.
services:
  - type: web
    name: paymates
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PAYMATES_MODE            # auto = use models when a key exists, else rules; offline = rules only
        value: auto
      - key: PAYMATES_PACING_MS       # pause between agent steps so the live trace is watchable
        value: "450"
      - key: PAYMATES_LLM_TIMEOUT     # seconds before a slow model falls back to rules
        value: "15"
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYMATES_TRIAGE_MODEL        # e.g. gemini:gemini-3.5-flash-lite
        sync: false
      - key: PAYMATES_RESPONDER_MODEL     # e.g. gemini:gemini-3.5-flash-lite
        sync: false
      - key: PAYMATES_ESCALATION_MODEL    # e.g. gemini:gemini-3.5-flash-lite
        sync: false
      - key: PAYMATES_ACTION_MODEL        # e.g. gemini:gemini-3.5-flash
        sync: false
